services:
  - type: web
    name: ventaflow-pos
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: PLATFORM_MP_ACCESS_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@comprobantespos.com
      - key: ADMIN_PASSWORD
        sync: false
